name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Build APK and run unit tests
        run: ./gradlew :rubik:assembleDebug :rubik:testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: rubik-debug-apk
          path: rubik/build/outputs/apk/debug/*.apk
          if-no-files-found: error
